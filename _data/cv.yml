- title: Working Experience
  type: time_table
  contents:
    - title: Research Assistant Professor
      institution: UTC Research Institute / Center for Urban Informatics and Progress (CUIP), The University of Tennessee at Chattanooga, USA
      year: Aug 2025 - Present
      description:
        - Research on multimodal perception, language-guided multi-camera understanding, graph-based reasoning, and AI systems for urban decision support
        - Co-authored the Refer-CityFlow/M3Track benchmark for language-driven multi-target multi-camera tracking (WACV 2027, accepted; 40 cameras, 7,699 natural-language queries)
        - Leading research on sensor fusion, personalized federated trajectory forecasting, and edge AI pipelines; graduate mentoring and industry-university collaborations

    - title: Postdoctoral Researcher
      institution: Center for Urban Informatics and Progress, The University of Tennessee at Chattanooga, USA
      year: Aug 2024 - Jul 2025
      description:
        - Leveraging large language models (LLMs) and graph neural networks to analyze vulnerabilities in blockchain smart contracts
        - Developing federated learning frameworks to enhance collaborative research and practical applications across smart city systems
        - Designing machine learning solutions for trajectory prediction at traffic intersections, utilizing decentralized data to improve accuracy and reliability

    - title: Researcher (Full-Time, TV-L E13)
      institution: L3S Research Center, Leibniz University Hannover, Germany
      year: Feb 2020 - Jul 2024
      description:
        - Led the MANDO, MANDO-GURU, and MANDO-HGT research on graph-based smart-contract security, extended by MANDO-LLM (ACM TOSEM 2026) with heterogeneous graph transformers and large language models
        - Utilizing graph embeddings to enhance investigative capabilities by predicting unseen connections in criminal networks
        - Applying graph neural networks to analyze data from cubelet sensors to enhance the accuracy of predicting multiple object trajectories
        - Developing a database to manage and analyze large-scale blockchain-powered social network data

    - title: Research Collaborator
